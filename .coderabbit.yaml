# CodeRabbit Configuration for pq-jwt
# https://docs.coderabbit.ai/guides/configure-coderabbit

# Language and framework settings
language: rust
framework: cargo

# Review settings
reviews:
  # Request changes if critical issues are found
  request_changes_workflow: true

  # Auto-approve PRs that only have minor changes
  auto_review:
    enabled: true
    # Don't auto-approve if these conditions are met
    exclude:
      - security_issues
      - breaking_changes
      - failed_tests

  # Review depth
  level: detailed  # Options: basic, detailed, comprehensive

  # Enable incremental reviews
  incremental: true

  # Focus areas for reviews
  focus:
    - security
    - performance
    - best_practices
    - correctness
    - maintainability
    - test_coverage

  # Comment style
  tone: constructive  # Options: constructive, direct, friendly

# Specific checks for Rust
rust:
  # Check for common Rust issues
  checks:
    - unsafe_code
    - unwrap_usage
    - panic_usage
    - todo_fixme_comments
    - error_handling
    - memory_safety
    - lifetime_issues
    - borrowing_issues
    - thread_safety
    - type_safety

  # Clippy integration
  clippy:
    enabled: true
    level: all  # Run all clippy lints

  # Rustfmt integration
  formatting:
    enabled: true
    check_only: true  # Don't auto-format, just check

  # Security checks
  security:
    enabled: true
    audit: true  # Run cargo audit

  # Performance checks
  performance:
    enabled: true
    suggest_optimizations: true

# File patterns to review
path_filters:
  # Include
  include:
    - "src/**/*.rs"
    - "tests/**/*.rs"
    - "benches/**/*.rs"
    - "examples/**/*.rs"
    - "Cargo.toml"
    - "Cargo.lock"
    - "README.md"
    - "CHANGELOG.md"

  # Exclude (don't review these)
  exclude:
    - "target/**"
    - "**/*.lock"
    - ".git/**"
    - ".github/**/*.yml"  # GitHub Actions are reviewed separately

# PR size and complexity
limits:
  # Warn if PR is too large
  max_files: 30
  max_lines: 1000

  # Warn about complex functions
  max_function_complexity: 15
  max_function_lines: 100

# Comment settings
comments:
  # Minimize noise
  minimize_comments: false

  # Group related comments
  group_comments: true

  # Add emoji to comments for quick scanning
  use_emoji: true

  # Collapse resolved comments
  collapse_resolved: true

# AI model settings
ai:
  # Use the most capable model for Rust
  model: gpt-4  # Options: gpt-3.5-turbo, gpt-4

  # Context window
  max_tokens: 8000

  # Be thorough with reviews
  thoroughness: high  # Options: low, medium, high

# Integration settings
integrations:
  # GitHub settings
  github:
    # Auto-assign reviewers
    auto_assign: false

    # Add labels based on review
    auto_label: true
    labels:
      security_issue: "security"
      performance_issue: "performance"
      bug: "bug"
      enhancement: "enhancement"
      breaking_change: "breaking-change"

    # Request changes for critical issues
    request_changes_on:
      - security_issue
      - failing_tests
      - breaking_change_without_version_bump

  # CircleCI integration
  circleci:
    enabled: true
    wait_for_ci: true  # Wait for CI to pass before reviewing

# Learning and improvement
learning:
  # Learn from past reviews
  enabled: true

  # Remember project-specific patterns
  remember_patterns: true

  # Adapt to team's coding style
  adapt_to_style: true

# Notifications
notifications:
  # When to notify
  on:
    - review_complete
    - critical_issue_found
    - all_checks_passed

  # Channels (if configured)
  channels:
    - github_comments
    - pr_review_comments

# Special handling for different PR types
pr_types:
  # Release PRs
  release:
    pattern: "^(release|Release|RELEASE).*"
    extra_checks:
      - version_bump
      - changelog_updated
      - documentation_updated
      - breaking_changes_documented

  # Hotfix PRs
  hotfix:
    pattern: "^(hotfix|Hotfix|HOTFIX).*"
    priority: high
    fast_track: true

  # Dependency updates
  dependencies:
    pattern: "^(deps|chore\\(deps\\)).*"
    focus:
      - security_vulnerabilities
      - breaking_changes
      - license_compatibility

# Project-specific rules
custom_rules:
  # Require tests for new features
  - name: "tests_required"
    pattern: "src/**/*.rs"
    condition: "new_public_function"
    action: "warn"
    message: "Consider adding tests for new public functions"

  # Require documentation for public APIs
  - name: "docs_required"
    pattern: "src/**/*.rs"
    condition: "new_public_function"
    action: "request_changes"
    message: "Public functions must have documentation comments"

  # Warn about unwrap usage
  - name: "avoid_unwrap"
    pattern: "src/**/*.rs"
    condition: "contains('.unwrap()')"
    action: "warn"
    message: "Consider using proper error handling instead of .unwrap()"

  # Warn about panic usage
  - name: "avoid_panic"
    pattern: "src/**/*.rs"
    condition: "contains('panic!')"
    action: "warn"
    message: "Avoid using panic! in library code. Use Result instead."

  # Require CHANGELOG update for non-trivial changes
  - name: "changelog_update"
    pattern: "src/**/*.rs"
    condition: "lines_changed > 50"
    action: "warn"
    message: "Consider updating CHANGELOG.md for significant changes"

# Ignore patterns (don't comment on these)
ignore_patterns:
  - "TODO\\(.*\\):"  # Allow TODO comments with assignee
  - "FIXME\\(.*\\):"  # Allow FIXME comments with assignee
  - "HACK:"  # Allow documented hacks
  - "XXX:"  # Allow XXX markers

# Summary settings
summary:
  enabled: true
  include:
    - review_score
    - key_findings
    - security_issues
    - performance_suggestions
    - action_items

  # Post summary as a separate comment
  separate_comment: true

# Auto-improvements
auto_improve:
  # Suggest idiomatic Rust improvements
  suggest_idioms: true

  # Suggest performance improvements
  suggest_performance: true

  # Suggest security improvements
  suggest_security: true

  # Provide code examples
  provide_examples: true
